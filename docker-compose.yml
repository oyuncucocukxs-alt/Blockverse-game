version: '3.9'

services:
  # ────────────────────────────────────────────────────────
  # Node.js API Backend
  # ────────────────────────────────────────────────────────
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: blockverse_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/blockverse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GAME_SERVER_SECRET: ${GAME_SERVER_SECRET}
      FIREBASE_ADMIN_SDK_JSON: ${FIREBASE_ADMIN_SDK_JSON}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - blockverse_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────
  # MongoDB (Primary + Replica for transactions)
  # ────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: blockverse_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: blockverse
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./DevOps/docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - blockverse_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB replicaset initializer (runs once)
  mongo-init:
    image: mongo:7.0
    container_name: blockverse_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017
        -u ${MONGO_ROOT_USER} -p ${MONGO_ROOT_PASS}
        --authenticationDatabase admin
        --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})"
    networks:
      - blockverse_net

  # ────────────────────────────────────────────────────────
  # Redis
  # ────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: blockverse_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1000 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blockverse_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────
  # NGINX Reverse Proxy + SSL Termination
  # ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: blockverse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./DevOps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./DevOps/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - blockverse_net

  # ────────────────────────────────────────────────────────
  # Game Server (Unity Dedicated Server - Linux headless)
  # ────────────────────────────────────────────────────────
  gameserver:
    image: blockverse_gameserver:latest  # Built separately from Unity
    container_name: blockverse_game_1
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://api:3000/v1
      GAME_SERVER_SECRET: ${GAME_SERVER_SECRET}
      SERVER_ID: game-server-1
      SERVER_REGION: us-east
      SERVER_PORT: 7777
      MAX_PLAYERS: 50
    ports:
      - "7777:7777/udp"
      - "7777:7777/tcp"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - blockverse_net

  # ────────────────────────────────────────────────────────
  # Prometheus Monitoring
  # ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: blockverse_prometheus
    restart: unless-stopped
    volumes:
      - ./DevOps/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - blockverse_net
    profiles: ["monitoring"]

  # ────────────────────────────────────────────────────────
  # Grafana Dashboard
  # ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: blockverse_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - blockverse_net
    profiles: ["monitoring"]

networks:
  blockverse_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
